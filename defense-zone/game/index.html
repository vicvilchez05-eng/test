<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0a">
  <title>Defense Zone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27%233fa7ff%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2750%27 text-anchor=%27middle%27 fill=%27white%27%3E%E2%98%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ================= MENÚ PRINCIPAL ================= -->
  <section id="screen-menu" class="screen">
    <div class="menu-card">
      <h1 class="title"><span class="title-defense">DEFENSE</span><span class="title-zone">ZONE</span></h1>
      <p class="tagline">Detén al héroe enemigo. Lleva al tuyo al otro lado.</p>
      <nav class="menu-buttons">
        <button class="btn btn-primary" id="btn-start">▶ Iniciar partida</button>
        <button class="btn" id="btn-settings">⚙ Ajustes</button>
        <button class="btn btn-danger" id="btn-exit">✕ Salir</button>
      </nav>
      <p class="version">v1.0 · toca una carta y luego el mapa, o arrástrala</p>
    </div>
  </section>

  <!-- ================= AJUSTES ================= -->
  <section id="screen-settings" class="screen overlay hidden">
    <div class="panel">
      <h2>Ajustes</h2>
      <div class="setting">
        <label>Calidad gráfica</label>
        <div class="segmented" id="quality-seg">
          <button data-q="low">Baja</button>
          <button data-q="medium">Media</button>
          <button data-q="high">Alta</button>
        </div>
      </div>
      <div class="setting">
        <label for="music-vol">Volumen de música <span id="music-val"></span></label>
        <input type="range" id="music-vol" min="0" max="100" step="1">
      </div>
      <div class="setting">
        <label for="sfx-vol">Volumen de efectos <span id="sfx-val"></span></label>
        <input type="range" id="sfx-vol" min="0" max="100" step="1">
      </div>
      <div class="panel-buttons">
        <button class="btn btn-primary" id="btn-settings-back">Volver</button>
      </div>
    </div>
  </section>

  <!-- ================= HUD DE PARTIDA ================= -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="hero-status left">
        <span class="hero-tag blue">TÚ</span>
        <div class="hp-mini"><div id="hp-player" class="hp-fill blue"></div></div>
      </div>
      <div id="clock">
        <div id="timer">00:00</div>
        <div id="phase-bar"><div id="phase-fill"></div>
          <i class="mark" style="left:40%" title="Lluvia"></i>
          <i class="mark" style="left:60%" title="Velocidad x2"></i>
        </div>
        <div id="phase-label"></div>
      </div>
      <div class="hero-status right">
        <div class="hp-mini"><div id="hp-enemy" class="hp-fill red"></div></div>
        <span class="hero-tag red">IA</span>
      </div>
      <button id="btn-pause" class="icon-btn" aria-label="Pausa">❚❚</button>
    </div>

    <div id="toast"></div>
    <div id="banner" class="hidden"></div>

    <div id="cardbar">
      <div id="next-card" class="next">
        <span class="next-label">Siguiente</span>
        <div class="next-icon" id="next-icon"></div>
      </div>
      <div id="hand"></div>
      <div id="mana">
        <div id="mana-bar"><div id="mana-fill"></div><div id="mana-ticks"></div></div>
        <div id="mana-text">5 / 10</div>
      </div>
    </div>
  </div>

  <!-- ================= PAUSA ================= -->
  <section id="screen-pause" class="screen overlay hidden">
    <div class="panel">
      <h2>Pausa</h2>
      <div class="panel-buttons vertical">
        <button class="btn btn-primary" id="btn-resume">Continuar</button>
        <button class="btn" id="btn-pause-settings">Ajustes</button>
        <button class="btn btn-danger" id="btn-quit">Salir al menú</button>
      </div>
    </div>
  </section>

  <!-- ================= FIN DE PARTIDA ================= -->
  <section id="screen-end" class="screen overlay hidden">
    <div class="end-content">
      <h2 id="end-title">VICTORIA</h2>
      <p id="end-reason"></p>
      <div class="panel-buttons">
        <button class="btn btn-primary" id="btn-again">Jugar de nuevo</button>
        <button class="btn" id="btn-menu">Menú principal</button>
      </div>
    </div>
  </section>

  <div id="rotate-hint"><div>Gira el dispositivo a horizontal 🔄</div></div>
</div>
<!-- Bundle generado con `node tools/build.mjs` a partir de js/main.js (no editar dist/ a mano) -->
<script src="dist/app.js" defer></script>
</body>
</html>
