# Compila los APK de ESFIGHTERS y ESFIGHTERS 3D en cada cambio de los juegos o del proyecto Android
# y los deja para descargar en la sección "Releases" del repositorio (etiqueta apk-latest).
name: APK de ESFIGHTERS

on:
  push:
    paths:
      - "android/**"
      - "esfighters/**"
      - "esfighters3d/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APKs
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar (firma de depuración, uso personal)
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Preparar los archivos
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ESFIGHTERS.apk
          cp android/app3d/build/outputs/apk/debug/app3d-debug.apk ESFIGHTERS-3D.apk

      - name: Guardar los APK como artefacto del flujo
        uses: actions/upload-artifact@v4
        with:
          name: ESFIGHTERS-apk
          path: |
            ESFIGHTERS.apk
            ESFIGHTERS-3D.apk

      - name: Publicar los APK en Releases (etiqueta apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create apk-latest ESFIGHTERS.apk ESFIGHTERS-3D.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ESFIGHTERS APK" \
              --notes "APK de uso personal compilados automáticamente. ESFIGHTERS.apk es el juego 2D pixel art y ESFIGHTERS-3D.apk el juego 3D. Instálalos en tu Android (activa 'instalar apps de origen desconocido' la primera vez)."
          else
            gh release upload apk-latest ESFIGHTERS.apk ESFIGHTERS-3D.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit apk-latest --repo "$GITHUB_REPOSITORY" --notes "APK de uso personal compilado automáticamente el $(date -u +%Y-%m-%d\ %H:%M) UTC desde el commit ${GITHUB_SHA::7}. ESFIGHTERS.apk es el juego 2D pixel art y ESFIGHTERS-3D.apk el juego 3D. Instálalos en tu Android (activa 'instalar apps de origen desconocido' la primera vez)."
          fi
